# Built-in agent presets. The global config and project files can override any of these
# fields or define new agents, optionally with `inherits = "<preset>"`.

agent = "claude"

[when.linux]
sandbox.nono.groups = ["linux_temp_read"]

[agents.claude]
kind = "claude"
command = "claude"
sandbox.nono.profile = "cb:claude"           # built into cb, no `nono pull` needed

[agents.codex]
command = "codex"

[agents.omp]
command = "omp"
sandbox.nono.profile = "omp"

[agents.opencode]
command = "opencode"

[agents.pi]
command = "pi"
sandbox.nono.profile = "pi"
