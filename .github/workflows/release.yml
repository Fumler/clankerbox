name: Dispatch - Release

run-name: Release ${{ inputs.version || '(version from commits)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0. Leave empty to derive it from conventional commits."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release (version, changelog, tag)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(git cliff --bumped-version)}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version**" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: cargo test --locked

      - name: Set version in Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Generate CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git cliff --tag "v$VERSION" --output CHANGELOG.md

      - name: Commit, tag and push release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - name: Linux arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - name: macOS x86_64
            target: x86_64-apple-darwin
            os: macos-latest
          - name: macOS arm64
            target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: cb-v${{ needs.prepare.outputs.version }}-${{ matrix.target }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir "$ARCHIVE"
          cp -r "target/${{ matrix.target }}/release/cb" LICENSE README.md CHANGELOG.md docs "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag with history
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Write release notes
        run: git cliff --latest --strip header --output notes.md

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" --notes-file notes.md --verify-tag
          echo "Published [v$VERSION](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
